<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
  <title id="title">S21 Rooms — Room booking, inside Telegram.</title>
  <desc id="description">A dark and mint cover for the School 21 community room-booking project, with an illustrated floor plan and a room, time, booking flow.</desc>
  <rect x="1" y="1" width="1278" height="438" rx="22" fill="#0b1111" stroke="#263533"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="64" cy="56" r="4" fill="#a0e8c5"/>
    <text x="79" y="61" fill="#9eafaa" font-size="11" letter-spacing="2.4">SCHOOL 21 / COMMUNITY PROJECT</text>
    <path d="M61 84H1218" stroke="#263533"/>
    <text x="57" y="175" fill="#f2f7f4" font-size="82" font-weight="700" letter-spacing="-3">S21 Rooms<tspan fill="#a0e8c5">.</tspan></text>
    <text x="62" y="229" fill="#c0cfc9" font-size="26">Room booking, inside Telegram.</text>
    <text x="62" y="266" fill="#80968d" font-size="17">Find a space. Pick a time. Keep your focus.</text>
    <g font-size="12">
      <rect x="62" y="315" width="148" height="38" rx="8" fill="#12221c" stroke="#2d483b"/>
      <text x="81" y="339" fill="#a0e8c5">01 / Choose a room</text>
      <path d="m222 330 5 5-5 5" fill="none" stroke="#597467" stroke-width="1.5"/>
      <rect x="242" y="315" width="133" height="38" rx="8" fill="#13201c" stroke="#293c33"/>
      <text x="261" y="339" fill="#b9cbc1">02 / Pick a slot</text>
      <path d="m388 330 5 5-5 5" fill="none" stroke="#597467" stroke-width="1.5"/>
      <rect x="409" y="315" width="144" height="38" rx="8" fill="#13201c" stroke="#293c33"/>
      <text x="428" y="339" fill="#b9cbc1">03 / Reserve it</text>
    </g>
    <text x="63" y="399" fill="#617a6d" font-size="10" letter-spacing="1.4">PYTHON / FLASK / SQLITE / TELEGRAM MINI APP</text>
    <g transform="translate(782 113)">
      <rect width="436" height="241" rx="16" fill="#101b17" stroke="#2c4035"/>
      <text x="22" y="29" fill="#8aa393" font-size="10" letter-spacing="2">A SPACE FOR YOUR NEXT IDEA</text>
      <rect x="20" y="48" width="144" height="88" rx="9" fill="#1c3527" stroke="#658b70"/>
      <rect x="178" y="48" width="238" height="88" rx="9" fill="#17261f" stroke="#334e3e"/>
      <rect x="20" y="150" width="396" height="70" rx="9" fill="#17261f" stroke="#334e3e"/>
      <g fill="none" stroke="#a0e8c5" stroke-width="1.8">
        <rect x="45" y="70" width="34" height="28" rx="4"/>
        <path d="M54 104v-6m16 6v-6M62 70v-7"/>
        <circle cx="379" cy="91" r="13" stroke="#749c82"/>
        <path d="M379 83v9l6 4" stroke="#749c82"/>
        <rect x="43" y="172" width="82" height="27" rx="13" stroke="#749c82"/>
        <path d="M61 166v-5m45 5v-5m-45 44v5m45-5v5" stroke="#749c82"/>
      </g>
      <text x="94" y="84" fill="#b4d4be" font-size="10">QUIET</text>
      <text x="94" y="102" fill="#b4d4be" font-size="10">SPACE</text>
      <text x="201" y="86" fill="#99b7a4" font-size="12">Your time,</text>
      <text x="201" y="105" fill="#99b7a4" font-size="12">planned ahead.</text>
      <text x="155" y="190" fill="#99b7a4" font-size="13">Room for your team.</text>
    </g>
    <text x="790" y="397" fill="#617a6d" font-size="10" letter-spacing="1.4">OPEN SOURCE / RU + UZ / MIT</text>
  </g>
</svg>
